name: build-deploy-lab
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/proranked/proranked-cpms-starter

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest-arm64
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-lab:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Write kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.K3S_LAB_KUBECONFIG }}" | base64 -d > "$HOME/.kube/config"
      - name: Apply + roll
        run: |
          kubectl --context k3s-lab apply -f k8s/dev/
          kubectl --context k3s-lab -n phevnix-v2 set image deployment/cpms-starter \
            cpms-starter=${{ env.IMAGE }}:${{ github.sha }}
          kubectl --context k3s-lab -n phevnix-v2 rollout status deployment/cpms-starter --timeout=120s
