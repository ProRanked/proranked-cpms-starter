server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA client-side routing: every unknown path falls back to index.html so /auth/callback,
    # /chargers, /sessions etc. resolve in the browser router.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never cache the shell or runtime config (so a redeploy / config swap is picked up immediately).
    location = /index.html { add_header Cache-Control "no-store"; }
    location = /config.js   { add_header Cache-Control "no-store"; }

    # Long-cache the fingerprinted build assets.
    location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }

    location = /healthz { return 200 'ok'; add_header Content-Type text/plain; }
}
